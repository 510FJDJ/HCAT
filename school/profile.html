<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script>
        // 無障礙：清掉網址列殘留的錨點 hash（例如按過跳過導覽連結後留下的 #goCenter），
        // 避免重新整理時瀏覽器原生錨點跳轉把捲動位置與焦點帶到該錨點，而非停留頁首
        if (window.location.hash) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學校基本資料 - 輔具管理資訊系統</title>
    <link rel="icon" type="image/png" href="../img/logo/logo.png">
    <meta name="description" content="學校端維護學校聯絡資料，包含學校電話、地址與輔具收送地點">
    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="../css/all.css">
</head>
<body>
    <!-- 無障礙：跳過導覽列，進入主要內容區 -->
    <a href="#goCenter" class="sr-only focusable" accesskey="C" title="跳過導覽列，進入主要內容區">主要內容區</a>
    <!-- 無障礙：跳至上方導覽列（不進入一般 Tab 順序，僅供 Alt+U 快速鍵定位） -->
    <a href="#headerNav" class="sr-only focusable" accesskey="U" title="跳至上方導覽列" tabindex="-1">上方導覽列</a>

    <div id="header" data-layout="../layout/header_School.html"></div>

    <main id="goCenter" tabindex="-1" class="bg-green bg-green-bleed">
        <section class="bannerWave">
            <div class="bannerWave-bg" aria-hidden="true"></div>

            <svg class="bannerWave-line bannerWave-line-desktop" aria-hidden="true" viewBox="0 0 1440 330" preserveAspectRatio="none">
                <path d="M1440 216 C 1160 284 900 326 660 312 C 440 298 260 230 0 222" fill="none" stroke="#8EC3BF" stroke-width="1.5" stroke-dasharray="6 8" vector-effect="non-scaling-stroke"></path>
            </svg>
            <svg class="bannerWave-line bannerWave-line-tablet" aria-hidden="true" viewBox="0 0 1440 330" preserveAspectRatio="none">
                <path d="M1440 216 C 1160 255 900 278 660 270 C 440 262 260 225 0 222" fill="none" stroke="#8EC3BF" stroke-width="1.5" stroke-dasharray="6 8" vector-effect="non-scaling-stroke"></path>
            </svg>
            <svg class="bannerWave-line bannerWave-line-mobile" aria-hidden="true" viewBox="0 0 1440 220" preserveAspectRatio="none">
                <path d="M1440 144 C1160 168 900 182 660 177 C440 173 260 150 0 148" fill="none" stroke="#8EC3BF" stroke-width="1.5" stroke-dasharray="6 8" vector-effect="non-scaling-stroke"></path>
            </svg>

            <div class="bannerWave-illuClip" aria-hidden="true">
                <img class="bannerWave-illu" src="../img/banner/school.webp" alt="">
            </div>
            <img class="bannerWave-leaf bannerWave-leaf-1" src="../img/deco/leaf-1.webp" alt="" aria-hidden="true">
            <img class="bannerWave-leaf bannerWave-leaf-2" src="../img/deco/flower.webp" alt="" aria-hidden="true">

            <div class="profilePage-container">
                <div class="bannerWave-inner">
                    <nav class="crumbNav" aria-label="麵包屑導覽">
                        <ol>
                            <li><a href="index.html" class="crumbNav-home" aria-label="首頁"><i class="bi bi-house-door" aria-hidden="true"></i></a></li>
                            <li><span class="crumbNav-sep" aria-hidden="true">/</span></li>
                            <li>學校與帳號</li>
                            <li><span class="crumbNav-sep" aria-hidden="true">/</span></li>
                            <li aria-current="page" class="crumbNav-current">學校基本資料</li>
                        </ol>
                    </nav>

                    <div class="bannerWave-main">
                        <h1 class="titleSection bannerWave-title">
                            <span class="dotsGrid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
                            學校基本資料
                        </h1>
                        <p class="bannerWave-desc">維護學校聯絡資料。學校名稱、代碼、學制由特教資源中心維護，需要修改請聯繫中心。</p>
                    </div>
                </div>
            </div>
        </section>

        <div class="profilePage-content">
            <div class="profilePage-container">
                <section class="cardPanel" aria-labelledby="si-basic">
                    <div class="cardPanel-head">
                        <h2 id="si-basic" class="cardPanel-title">學校基本資料</h2>
                    </div>

                    <dl class="infoGrid">
                        <div>
                            <dt class="infoGrid-label">學校名稱</dt>
                            <dd class="infoGrid-value">新竹縣竹北市竹北國民小學</dd>
                        </div>
                        <div>
                            <dt class="infoGrid-label">學校代碼</dt>
                            <dd class="infoGrid-value infoGrid-value-mono">〔學校代碼〕</dd>
                        </div>
                        <div>
                            <dt class="infoGrid-label">學制</dt>
                            <dd class="infoGrid-value"><span class="tagPill tag-tealSoft">國小</span></dd>
                        </div>
                        <div>
                            <dt class="infoGrid-label">鄉鎮市</dt>
                            <dd class="infoGrid-value">竹北市</dd>
                        </div>
                    </dl>

                    <form class="profileCard-form" id="schoolProfileForm">
                        <div class="formGrid formGrid-cols3">
                            <div>
                                <label for="siTel" class="formField-label">學校電話 <span class="formField-required">必填</span></label>
                                <input type="tel" id="siTel" class="form-control" value="03-5551234" placeholder="例：03-5551234">
                            </div>
                            <div class="formGrid-span2">
                                <label for="siAddr" class="formField-label">學校地址 <span class="formField-required">必填</span></label>
                                <input type="text" id="siAddr" class="form-control" value="新竹縣竹北市○○路○號" placeholder="例：新竹縣竹北市○○路○號">
                            </div>
                            <div class="formGrid-full">
                                <label for="siSpot" class="formField-label">輔具收送地點</label>
                                <input type="text" id="siSpot" class="form-control" value="行政大樓 2 樓 資源班教室" placeholder="例：行政大樓 2 樓 資源班教室" aria-describedby="siSpotHint">
                                <p id="siSpotHint" class="formField-hint">中心或廠商送件、收回輔具時，會依這個地點聯繫。</p>
                            </div>
                        </div>

                        <div class="flex-center-center">
                            <button type="submit" class="btnPill btn-teal">儲存學校資料</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <div data-layout="../layout/footer.html"></div>

    <script src="../js/vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/all.js"></script>
</body>
</html>
